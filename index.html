<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>ქესალო</title>
<!-- the `mini` Edge Function (mini/app.js reads it; the doctor's Pages check looks for it in this file) -->
<meta name="qesalo-api" content="https://owgvoonnsccujzpbprpw.supabase.co/functions/v1/mini">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,400..800&family=Noto+Sans:wdth,wght@62.5..100,400..800&display=swap">
<style>
/* The panel in design C „ნახაზი" (wave design2, 8.11.2026; design/phase1/C-plan/DESIGN.md, the cards' lib/card-html.mjs):
   ONE look on every device = the survey sheet (drawing paper, carbon ink), whatever Telegram's colorScheme or the phone's
   dark mode says (uifix 11.11.2026, Otar: the phone showed the old dark „cyanotype" set in navy, the web black and white;
   that set is gone). Our own tokens, never raw themeParams for text (4.5:1 checked for every text pair). One family,
   Noto Sans Georgian, at three widths (wdth 62.5 display figures and titles, 75 Mtavruli labels, 100 reading text);
   Mtavruli is emitted as code points (mt() below), never by text-transform. Zero radius; nothing eases (state changes
   are two-frame steps, 90 ms). Status = a shape plus a word, never colour alone; colour never sits on a number. */
:root{--q-canvas:#E9EAE5;--q-surface:#F8F8F5;--q-surface-2:#EDEEE9;--q-rule:#141615;--q-rule-light:#C4C7BF;--q-ink:#111312;--q-ink-2:#2D312F;--q-muted:#555A56;--q-accent:#1C46A8;--q-focus:#1C46A8;--q-invert:#111312;--q-on-invert:#F8F8F5;--q-good:#1B6E2E;--q-good-bg:#DDEEDF;--q-warn:#8A5100;--q-warn-bg:#F6E7C6;--q-crit:#B8360A;--q-crit-bg:#F8DCD3;--q-info:#555A56;--q-nursery:#8C2A6E;--q-main:#5E9A2F;--q-viz-fill:#111312;--q-viz-alt:#F8F8F5;--q-safe-top:0px;--q-safe-bottom:0px;--ff:'Noto Sans Georgian','Noto Sans',system-ui,sans-serif;--step:steps(2,jump-none);color-scheme:only light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--q-canvas);color:var(--q-ink)}
body{font:400 15px/20px var(--ff);font-stretch:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--q-focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation:none!important}}
.app{max-width:560px;margin:0 auto;padding:0 12px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--q-canvas);margin:0 -12px;padding:calc(6px + var(--q-safe-top)) 12px 8px}
/* the header frame: company cell (the legal name, then the live mark at the right) | the language switch. No name, no
   role, no „განახლდა" (otar-1011 §1.3, Otar's 3): the time of the data stands where it is a fact of the data */
.brand{display:flex;align-items:stretch;border:3px solid var(--q-rule);background:var(--q-surface)}
.brand-c{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px}
.logo{flex:none;display:flex;gap:4px;align-items:center}
.brand-t{font:700 12px/15px var(--ff);font-stretch:75%;letter-spacing:.06em;min-width:0}
/* the live mark (W-RT; otar-1011: alone, after the company's name, no text): a filled ink square = live (a change shows by
   itself), a ring = checking every 30 s (the socket is down); its label (title / aria-label) = the words + the time of
   the last answer. No colour carries it, nothing blinks. */
.lv{flex:none;display:inline-block;width:7px;height:7px;margin-left:auto;background:var(--q-ink)}
.lv.poll{background:transparent;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--q-muted)}
.lv[hidden]{display:none}
/* plan symbols: the nursery = a tree on a planting plan (circle + centre point), the main company = a plot (square).
   The glyph inside is for text readers only; the drawing is the box. */
.sym{flex:none;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px}
.sym i{font-size:0;line-height:0;font-style:normal}
.sym.nursery{border:2px solid var(--q-nursery);border-radius:50%}
.sym.nursery::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--q-nursery)}
.sym.main{background:var(--q-main)}
/* the view-as bar (otar-1011 W1): whose panel this is while the admin looks as someone else (the chat's /as or the
   სუპერადმინი tab - one bot_people.view_as row); a ring (design C „info") and the words, the exit a boxed cell inverted
   on press. It replaces the red test box. Two lines when a long level does not fit; nothing eases. */
.va{margin-top:6px;display:flex;align-items:stretch;min-height:36px;border:1.5px solid var(--q-rule);background:var(--q-surface-2);font:600 12.5px/16px var(--ff);color:var(--q-ink)}
.va-t{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 10px}
.va-t::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--q-ink)}
.va-x{flex:none;position:relative;min-width:44px;padding:0 12px;border:0;border-left:1.5px solid var(--q-rule);border-radius:0;background:var(--q-surface);font:700 12px/15px var(--ff);font-stretch:75%;letter-spacing:.06em;color:var(--q-ink);cursor:pointer;transition:background-color 90ms var(--step),color 90ms var(--step)}
.va-x::after{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.va-x:active{background:var(--q-invert);color:var(--q-on-invert)}
.seg[hidden],.va[hidden]{display:none}
/* the company switch: boxed cells in a 3 px frame; the chosen cell is inverted in a two-frame step */
.seg{display:flex;margin-top:6px;border:3px solid var(--q-rule);background:var(--q-surface)}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;border-radius:0;background:var(--q-surface);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 6px;font:700 12px/15px var(--ff);font-stretch:75%;letter-spacing:.06em;color:var(--q-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color 90ms var(--step),color 90ms var(--step)}
.seg button+button{border-left:1.5px solid var(--q-rule)}
.seg button:active{background:var(--q-surface-2)}
.seg button.on{background:var(--q-invert);color:var(--q-on-invert)}
.seg button.on .sym.nursery{border-color:var(--q-on-invert)}.seg button.on .sym.nursery::after{background:var(--q-on-invert)}.seg button.on .sym.main{background:var(--q-on-invert)}
/* the tab bar: boxed cells under a 3 px rule, held at the bottom of the screen (sticky, the last element of the page),
   Mtavruli labels, the active cell inverted; scrolls sideways when a person has more tabs than fit */
.tabbar{position:sticky;bottom:0;z-index:10;margin:auto -12px 0;background:var(--q-surface);border-top:3px solid var(--q-rule);padding-bottom:var(--q-safe-bottom)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;background:var(--q-surface)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:72px;min-height:52px;border:0;border-radius:0;background:var(--q-surface);padding:0 10px;display:flex;align-items:center;justify-content:center;font:700 11px/14px var(--ff);font-stretch:75%;letter-spacing:.02em;color:var(--q-ink);cursor:pointer;position:relative;white-space:nowrap;transition:background-color 90ms var(--step),color 90ms var(--step)}
.tab+.tab{border-left:1.5px solid var(--q-rule)}
.tab:active{background:var(--q-surface-2)}
.tab.on{background:var(--q-invert);color:var(--q-on-invert)}
.tab .b{position:absolute;top:3px;right:3px;min-width:16px;height:15px;padding:0 3px;background:var(--q-crit);color:var(--q-surface);font:700 10.5px/15px var(--ff);text-align:center}
/* item 15b (bot-v3): where the row stands - a 2 px position bar under it (track = the light rule, the ink block = the
   part on screen: the survey sheet's scale bar) and a boxed chevron cell at an edge while tabs are hidden on that side */
.tpos{position:relative;height:2px;background:var(--q-rule-light)}
.tpos i{position:absolute;top:0;bottom:0;left:0;background:var(--q-ink)}
.tch{position:absolute;top:0;z-index:1;width:44px;height:52px;border:0;border-radius:0;padding:0 0 3px;background:var(--q-surface);color:var(--q-ink);font:700 22px/1 var(--ff);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color 90ms var(--step)}
.tch:active{background:var(--q-surface-2)}
.tch.l{left:0;border-right:1.5px solid var(--q-rule)}
.tch.r{right:0;border-left:1.5px solid var(--q-rule)}
.tpos[hidden],.tch[hidden]{display:none}
/* the sheet: every block of a tab is a cell of one framed sheet, split by ink lines */
#view{margin-top:8px;border:3px solid var(--q-rule);background:var(--q-surface)}
#view>*+*{border-top:1.5px solid var(--q-rule)}
.card{padding:0 12px 2px}
.card-h{display:flex;align-items:baseline;gap:8px;min-height:40px;padding:10px 0 6px}
.card-t{font:800 20px/23px var(--ff);font-stretch:62.5%;letter-spacing:.02em;flex:1 1 auto;min-width:0}
.card-n{font:600 12px/15px var(--ff);font-stretch:75%;letter-spacing:.04em;color:var(--q-muted);white-space:nowrap}
.hero{padding:10px 12px 12px}
.hero-l,.stat-l{font:600 11.5px/14px var(--ff);font-stretch:75%;letter-spacing:.09em;color:var(--q-muted)}
.hero-v{font:800 min(56px,14.5vw)/1.04 var(--ff);font-stretch:62.5%;margin-top:3px;white-space:nowrap}
.hero-s{font-size:13px;line-height:18px;color:var(--q-ink-2);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5px;background:var(--q-rule)}
.stat{background:var(--q-surface);padding:9px 12px 10px;min-width:0}
.stat:last-child:nth-child(odd){grid-column:1 / -1}
.stat-v{font:800 27px/30px var(--ff);font-stretch:62.5%;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-s{font-size:12.5px;line-height:16px;color:var(--q-muted);margin-top:2px}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:7px 0;border-top:1px solid var(--q-rule-light)}
.card>.row:first-child{border-top:0}
.row-m{flex:1 1 auto;min-width:0}
.row-t{font-size:15px;line-height:20px}
.row-c{font-size:12.5px;line-height:17px;color:var(--q-muted);margin-top:1px}
.row-v{font-size:15px;font-weight:600;white-space:nowrap;text-align:right}
.row-v small{display:block;font-size:12.5px;font-weight:400;color:var(--q-ink-2);margin-top:1px}
.tap{cursor:pointer;transition:background-color 90ms var(--step)}
.tap:active{background:var(--q-surface-2)}
.chev{flex:none;color:var(--q-muted);font-size:18px;transition:transform 90ms var(--step)}
.open-r .chev{transform:rotate(90deg)}
/* status shapes: diamond = critical, triangle = warning, ring = info, check = good */
.dot{flex:none;display:inline-block;width:12px;height:12px}
.dot.bad{background:var(--q-crit);transform:rotate(45deg) scale(.72)}
.dot.warn{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--q-warn)}
.dot.ok{width:6px;height:11px;margin:0 3px 2px;border:solid var(--q-good);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.dot.idle,.dot.info{border:1.5px solid var(--q-info);border-radius:50%}
.w{font-weight:600}.w.bad{color:var(--q-crit)}.w.warn{color:var(--q-warn)}.w.ok{color:var(--q-good)}.w.info{color:var(--q-muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;font:600 12px/1 var(--ff);white-space:nowrap}
.pill::before,.pos::before,.neg::before{content:"";display:inline-block;flex:none}
.p-ok{background:var(--q-good-bg);color:var(--q-good)}.p-warn{background:var(--q-warn-bg);color:var(--q-warn)}.p-bad{background:var(--q-crit-bg);color:var(--q-crit)}.p-grey{background:var(--q-surface-2);color:var(--q-ink-2)}
.p-ok::before,.pos::before{width:4px;height:8px;margin:0 2px 2px;border:solid var(--q-good);border-width:0 2px 2px 0;transform:rotate(45deg)}
.p-warn::before{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:8px solid var(--q-warn)}
.p-bad::before,.neg::before{width:7px;height:7px;background:var(--q-crit);transform:rotate(45deg)}
.pos,.neg{color:inherit}.pos::before,.neg::before{margin-right:7px;vertical-align:2px}
.mut{color:var(--q-muted)}
/* scale bar: alternating ink and paper blocks on a hairline, no filled track */
.bar{height:7px;margin-top:6px;border-bottom:1px solid var(--q-rule-light)}
.bar i{display:block;height:6px;min-width:2px;background:repeating-linear-gradient(90deg,var(--q-viz-fill) 0 10px,var(--q-viz-alt) 10px 20px);border:1px solid var(--q-viz-fill)}
.bar i.over{background:repeating-linear-gradient(90deg,var(--q-crit) 0 10px,var(--q-crit-bg) 10px 20px);border-color:var(--q-crit)}
.note{padding:9px 12px 10px;font:600 13px/18px var(--ff);color:var(--q-ink)}
.card .note{padding:8px 0 6px;font-weight:400;font-size:12.5px;line-height:17px;color:var(--q-muted)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;background:var(--q-warn-bg);color:var(--q-warn);font:600 13px/18px var(--ff)}
.banner::before{content:"";flex:none;width:0;height:0;margin-top:4px;border-left:5.5px solid transparent;border-right:5.5px solid transparent;border-bottom:10px solid var(--q-warn)}
/* wave polish1: a closed alert says so (check + word), and the ✓ cell that closes one (a boxed 44 px cell, two-frame step) */
.banner.ok{background:var(--q-good-bg);color:var(--q-good)}
.banner.ok::before{width:5px;height:10px;margin:2px 3px 0;border:solid var(--q-good);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ack{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--q-rule);border-radius:0;background:var(--q-surface);cursor:pointer;padding:0;transition:background-color 90ms var(--step)}
.ack:active{background:var(--q-surface-2)}
.ack .dot.ok{margin:0 0 3px}
.nw{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap}
.chip{flex:1 1 auto;padding:8px 10px;text-align:center;font:600 12.5px/16px var(--ff);font-stretch:75%;letter-spacing:.04em;color:var(--q-ink-2)}
.chip+.chip{border-left:1.5px solid var(--q-rule)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:8px 0 4px}
.vb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb i{display:block;width:100%;max-width:44px;background:var(--q-viz-fill)}
.vb b{font:800 13px/1 var(--ff);font-stretch:62.5%;margin-bottom:4px;white-space:nowrap}
.vb span{font-size:12.5px;color:var(--q-muted);margin-top:6px}
.det{font-size:12.5px;color:var(--q-ink-2);background:var(--q-surface-2);padding:8px 10px;margin:0 0 10px;display:none}
.det.open{display:block}
.det div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.skel{background:var(--q-surface-2);height:14px;margin:14px 0}
.empty{text-align:center;color:var(--q-muted);font-size:14px;padding:28px 8px}
.empty .tab{display:inline-flex;min-height:44px;border:1.5px solid var(--q-rule)}
.foot{text-align:center;font-size:12px;color:var(--q-muted);margin:14px 0}
.mono{font-size:12.5px;letter-spacing:.02em}
/* „ორივე": a labelled section per company, never a total */
.co-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--q-surface);font:700 13px/16px var(--ff);font-stretch:75%;letter-spacing:.02em;color:var(--q-ink)}
#view>.co-h{border-top:3px solid var(--q-rule)}
#view>.co-h:first-child{border-top:0}
/* W-I18N (bot-v3 §2.4): the language switch - three small boxed labels stacked in the header frame's last cell, the
   chosen one inverted (design C's segmented control, two-frame step); ru/en labels in capitals of the Condensed face
   where Georgian uses Mtavruli (mt() code points - never text-transform on Georgian); the legal name stays Georgian,
   its Latin form under it once for a ru/en reader */
.brand-l{flex:none;display:flex;flex-direction:column;border-left:1.5px solid var(--q-rule)}
.brand-l button{flex:1 1 0;min-width:38px;min-height:17px;border:0;border-radius:0;padding:0 6px;background:var(--q-surface);font:700 10px/12px var(--ff);font-stretch:75%;letter-spacing:.05em;color:var(--q-muted);cursor:pointer;transition:background-color 90ms var(--step),color 90ms var(--step)}
.brand-l button+button{border-top:1px solid var(--q-rule-light)}
.brand-l button:active{background:var(--q-surface-2)}
.brand-l button.on{background:var(--q-invert);color:var(--q-on-invert)}
.brand-x{display:block;margin-top:2px;font:600 10.5px/13px var(--ff);font-stretch:100%;letter-spacing:.01em;color:var(--q-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t{overflow:hidden}
html:not([lang="ka"]) .card-t,html:not([lang="ka"]) .hero-l,html:not([lang="ka"]) .stat-l,html:not([lang="ka"]) .tab,html:not([lang="ka"]) .seg button,html:not([lang="ka"]) .co-h,html:not([lang="ka"]) .va-x{text-transform:uppercase}
/* the header and the tab bar reach the screen's edges through the page's side padding: the same 8 px when it narrows */
@media (max-width:340px){.app{padding-left:8px;padding-right:8px}.top{margin:0 -8px;padding-left:8px;padding-right:8px}.tabbar{margin-left:-8px;margin-right:-8px}.stat-v{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="brand-c"><span class="logo" id="logo"></span><div class="brand-t" id="brand">ᲥᲔᲡᲐᲚᲝ</div><i class="lv" id="lv" role="img" hidden></i></div>
      <div class="brand-l" id="lang" role="group" hidden></div>
    </div>
    <div class="va" id="va" role="status" hidden></div>
    <div class="seg" id="seg" hidden></div>
  </div>
  <div id="view"><div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div></div></div>
  <div class="foot" id="foot">&nbsp;</div>
  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <div class="tpos" id="tpos" hidden><i></i></div>
    <button class="tch l" id="tch-l" data-tch="-1" hidden>‹</button><button class="tch r" id="tch-r" data-tch="1" hidden>›</button>
  </div>
</div>
<script type="module" src="app.js?v=5aaf2cc.202611110820"></script>
</body>
</html>
