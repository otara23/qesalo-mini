<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ქესალო</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,400..800&display=swap">
<style>
/* The panel in design C „ნახაზი" (wave design2, 8.11.2026; design/phase1/C-plan/DESIGN.md, the cards' lib/card-html.mjs):
   light = the survey sheet (drawing paper, carbon ink), dark = the cyanotype blueprint; Telegram's colorScheme picks the
   set. Our own tokens, never raw themeParams for text (4.5:1 checked for every text pair, both themes). One family,
   Noto Sans Georgian, at three widths (wdth 62.5 display figures and titles, 75 Mtavruli labels, 100 reading text);
   Mtavruli is emitted as code points (mt() below), never by text-transform. Zero radius; nothing eases (state changes
   are two-frame steps, 90 ms). Status = a shape plus a word, never colour alone; colour never sits on a number. */
:root{--q-canvas:#E9EAE5;--q-surface:#F8F8F5;--q-surface-2:#EDEEE9;--q-rule:#141615;--q-rule-light:#C4C7BF;--q-ink:#111312;--q-ink-2:#2D312F;--q-muted:#555A56;--q-accent:#1C46A8;--q-focus:#1C46A8;--q-invert:#111312;--q-on-invert:#F8F8F5;--q-good:#1B6E2E;--q-good-bg:#DDEEDF;--q-warn:#8A5100;--q-warn-bg:#F6E7C6;--q-crit:#B8360A;--q-crit-bg:#F8DCD3;--q-info:#555A56;--q-nursery:#8C2A6E;--q-main:#5E9A2F;--q-viz-fill:#111312;--q-viz-alt:#F8F8F5;--q-safe-top:0px;--q-safe-bottom:0px;--ff:'Noto Sans Georgian',system-ui,sans-serif;--step:steps(2,jump-none)}
:root[data-theme="dark"]{--q-canvas:#0B2140;--q-surface:#0F284B;--q-surface-2:#143159;--q-rule:#DCE6F5;--q-rule-light:#34557F;--q-ink:#F2F6FC;--q-ink-2:#CEDAEC;--q-muted:#A3B6D2;--q-accent:#FFD66B;--q-focus:#FFD66B;--q-invert:#F2F6FC;--q-on-invert:#0B2140;--q-good:#3FBF7F;--q-good-bg:#123B3A;--q-warn:#FFC46B;--q-warn-bg:#3A3420;--q-crit:#FF8A50;--q-crit-bg:#4A2230;--q-info:#A3B6D2;--q-nursery:#E070B8;--q-main:#D4E57A;--q-viz-fill:#F2F6FC;--q-viz-alt:#0F284B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--q-canvas);color:var(--q-ink)}
body{font:400 15px/20px var(--ff);font-stretch:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--q-focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation:none!important}}
.app{max-width:560px;margin:0 auto;padding:0 12px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--q-canvas);margin:0 -12px;padding:calc(6px + var(--q-safe-top)) 12px 8px}
/* the header frame: company cell | who + when */
.brand{display:flex;align-items:stretch;border:3px solid var(--q-rule);background:var(--q-surface)}
.brand-c{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px}
.logo{flex:none;display:flex;gap:4px;align-items:center}
.brand-t{font:700 12px/15px var(--ff);font-stretch:75%;letter-spacing:.06em;min-width:0}
.brand-m{flex:none;max-width:46%;display:flex;flex-direction:column;justify-content:center;padding:6px 10px;border-left:1.5px solid var(--q-rule);font-size:12px;line-height:15px;color:var(--q-ink-2)}
.brand-m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* plan symbols: the nursery = a tree on a planting plan (circle + centre point), the main company = a plot (square).
   The glyph inside is for text readers only; the drawing is the box. */
.sym{flex:none;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px}
.sym i{font-size:0;line-height:0;font-style:normal}
.sym.nursery{border:2px solid var(--q-nursery);border-radius:50%}
.sym.nursery::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--q-nursery)}
.sym.main{background:var(--q-main)}
.test{margin-top:6px;display:flex;gap:8px;align-items:flex-start;border:3px solid var(--q-rule);background:var(--q-crit-bg);color:var(--q-crit);padding:6px 10px;font:600 12.5px/17px var(--ff)}
.test::before{content:"";flex:none;width:8px;height:8px;margin:4px 1px 0;background:var(--q-crit);transform:rotate(45deg)}
.seg[hidden],.test[hidden]{display:none}
/* the company switch: boxed cells in a 3 px frame; the chosen cell is inverted in a two-frame step */
.seg{display:flex;margin-top:6px;border:3px solid var(--q-rule);background:var(--q-surface)}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;border-radius:0;background:var(--q-surface);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 6px;font:700 12px/15px var(--ff);font-stretch:75%;letter-spacing:.06em;color:var(--q-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color 90ms var(--step),color 90ms var(--step)}
.seg button+button{border-left:1.5px solid var(--q-rule)}
.seg button:active{background:var(--q-surface-2)}
.seg button.on{background:var(--q-invert);color:var(--q-on-invert)}
.seg button.on .sym.nursery{border-color:var(--q-on-invert)}.seg button.on .sym.nursery::after{background:var(--q-on-invert)}.seg button.on .sym.main{background:var(--q-on-invert)}
/* the tab bar: boxed cells under a 3 px rule, held at the bottom of the screen (sticky, the last element of the page),
   Mtavruli labels, the active cell inverted; scrolls sideways when a person has more tabs than fit */
.tabs{position:sticky;bottom:0;z-index:10;margin:auto -12px 0;display:flex;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;background:var(--q-surface);border-top:3px solid var(--q-rule);padding-bottom:var(--q-safe-bottom)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:72px;min-height:52px;border:0;border-radius:0;background:var(--q-surface);padding:0 10px;display:flex;align-items:center;justify-content:center;font:700 11px/14px var(--ff);font-stretch:75%;letter-spacing:.02em;color:var(--q-ink);cursor:pointer;position:relative;white-space:nowrap;transition:background-color 90ms var(--step),color 90ms var(--step)}
.tab+.tab{border-left:1.5px solid var(--q-rule)}
.tab:active{background:var(--q-surface-2)}
.tab.on{background:var(--q-invert);color:var(--q-on-invert)}
.tab .b{position:absolute;top:3px;right:3px;min-width:16px;height:15px;padding:0 3px;background:var(--q-crit);color:var(--q-surface);font:700 10.5px/15px var(--ff);text-align:center}
/* the sheet: every block of a tab is a cell of one framed sheet, split by ink lines */
#view{margin-top:8px;border:3px solid var(--q-rule);background:var(--q-surface)}
#view>*+*{border-top:1.5px solid var(--q-rule)}
.card{padding:0 12px 2px}
.card-h{display:flex;align-items:baseline;gap:8px;min-height:40px;padding:10px 0 6px}
.card-t{font:800 20px/23px var(--ff);font-stretch:62.5%;letter-spacing:.02em;flex:1 1 auto;min-width:0}
.card-n{font:600 12px/15px var(--ff);font-stretch:75%;letter-spacing:.04em;color:var(--q-muted);white-space:nowrap}
.hero{padding:10px 12px 12px}
.hero-l,.stat-l{font:600 11.5px/14px var(--ff);font-stretch:75%;letter-spacing:.09em;color:var(--q-muted)}
.hero-v{font:800 min(56px,14.5vw)/1.04 var(--ff);font-stretch:62.5%;margin-top:3px;white-space:nowrap}
.hero-s{font-size:13px;line-height:18px;color:var(--q-ink-2);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5px;background:var(--q-rule)}
.stat{background:var(--q-surface);padding:9px 12px 10px;min-width:0}
.stat:last-child:nth-child(odd){grid-column:1 / -1}
.stat-v{font:800 27px/30px var(--ff);font-stretch:62.5%;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-s{font-size:12.5px;line-height:16px;color:var(--q-muted);margin-top:2px}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:7px 0;border-top:1px solid var(--q-rule-light)}
.card>.row:first-child{border-top:0}
.row-m{flex:1 1 auto;min-width:0}
.row-t{font-size:15px;line-height:20px}
.row-c{font-size:12.5px;line-height:17px;color:var(--q-muted);margin-top:1px}
.row-v{font-size:15px;font-weight:600;white-space:nowrap;text-align:right}
.row-v small{display:block;font-size:12.5px;font-weight:400;color:var(--q-ink-2);margin-top:1px}
.tap{cursor:pointer;transition:background-color 90ms var(--step)}
.tap:active{background:var(--q-surface-2)}
.chev{flex:none;color:var(--q-muted);font-size:18px;transition:transform 90ms var(--step)}
.open-r .chev{transform:rotate(90deg)}
/* status shapes: diamond = critical, triangle = warning, ring = info, check = good */
.dot{flex:none;display:inline-block;width:12px;height:12px}
.dot.bad{background:var(--q-crit);transform:rotate(45deg) scale(.72)}
.dot.warn{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--q-warn)}
.dot.ok{width:6px;height:11px;margin:0 3px 2px;border:solid var(--q-good);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.dot.idle,.dot.info{border:1.5px solid var(--q-info);border-radius:50%}
.w{font-weight:600}.w.bad{color:var(--q-crit)}.w.warn{color:var(--q-warn)}.w.ok{color:var(--q-good)}.w.info{color:var(--q-muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;font:600 12px/1 var(--ff);white-space:nowrap}
.pill::before,.pos::before,.neg::before{content:"";display:inline-block;flex:none}
.p-ok{background:var(--q-good-bg);color:var(--q-good)}.p-warn{background:var(--q-warn-bg);color:var(--q-warn)}.p-bad{background:var(--q-crit-bg);color:var(--q-crit)}.p-grey{background:var(--q-surface-2);color:var(--q-ink-2)}
.p-ok::before,.pos::before{width:4px;height:8px;margin:0 2px 2px;border:solid var(--q-good);border-width:0 2px 2px 0;transform:rotate(45deg)}
.p-warn::before{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:8px solid var(--q-warn)}
.p-bad::before,.neg::before{width:7px;height:7px;background:var(--q-crit);transform:rotate(45deg)}
.pos,.neg{color:inherit}.pos::before,.neg::before{margin-right:7px;vertical-align:2px}
.mut{color:var(--q-muted)}
/* scale bar: alternating ink and paper blocks on a hairline, no filled track */
.bar{height:7px;margin-top:6px;border-bottom:1px solid var(--q-rule-light)}
.bar i{display:block;height:6px;min-width:2px;background:repeating-linear-gradient(90deg,var(--q-viz-fill) 0 10px,var(--q-viz-alt) 10px 20px);border:1px solid var(--q-viz-fill)}
.bar i.over{background:repeating-linear-gradient(90deg,var(--q-crit) 0 10px,var(--q-crit-bg) 10px 20px);border-color:var(--q-crit)}
.note{padding:9px 12px 10px;font:600 13px/18px var(--ff);color:var(--q-ink)}
.card .note{padding:8px 0 6px;font-weight:400;font-size:12.5px;line-height:17px;color:var(--q-muted)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;background:var(--q-warn-bg);color:var(--q-warn);font:600 13px/18px var(--ff)}
.banner::before{content:"";flex:none;width:0;height:0;margin-top:4px;border-left:5.5px solid transparent;border-right:5.5px solid transparent;border-bottom:10px solid var(--q-warn)}
.chips{display:flex;flex-wrap:wrap}
.chip{flex:1 1 auto;padding:8px 10px;text-align:center;font:600 12.5px/16px var(--ff);font-stretch:75%;letter-spacing:.04em;color:var(--q-ink-2)}
.chip+.chip{border-left:1.5px solid var(--q-rule)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:8px 0 4px}
.vb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb i{display:block;width:100%;max-width:44px;background:var(--q-viz-fill)}
.vb b{font:800 13px/1 var(--ff);font-stretch:62.5%;margin-bottom:4px;white-space:nowrap}
.vb span{font-size:12.5px;color:var(--q-muted);margin-top:6px}
.det{font-size:12.5px;color:var(--q-ink-2);background:var(--q-surface-2);padding:8px 10px;margin:0 0 10px;display:none}
.det.open{display:block}
.det div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.skel{background:var(--q-surface-2);height:14px;margin:14px 0}
.empty{text-align:center;color:var(--q-muted);font-size:14px;padding:28px 8px}
.empty .tab{display:inline-flex;min-height:44px;border:1.5px solid var(--q-rule)}
.foot{text-align:center;font-size:12px;color:var(--q-muted);margin:14px 0}
.mono{font-size:12.5px;letter-spacing:.02em}
/* „ორივე": a labelled section per company, never a total */
.co-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--q-surface);font:700 13px/16px var(--ff);font-stretch:75%;letter-spacing:.02em;color:var(--q-ink)}
#view>.co-h{border-top:3px solid var(--q-rule)}
#view>.co-h:first-child{border-top:0}
@media (max-width:340px){.app{padding-left:8px;padding-right:8px}.stat-v{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="brand-c"><span class="logo" id="logo"></span><div class="brand-t" id="brand">ᲥᲔᲡᲐᲚᲝ</div></div>
      <div class="brand-m"><div id="who">&nbsp;</div><div id="at"></div></div>
    </div>
    <div class="test" id="test" hidden></div>
    <div class="seg" id="seg" hidden></div>
  </div>
  <div id="view"><div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div></div></div>
  <div class="foot" id="foot">ქესალო · მხოლოდ კითხვა — არაფერი იცვლება</div>
  <div class="tabs" id="tabs"></div>
</div>
<script>
const API = "https://owgvoonnsccujzpbprpw.supabase.co/functions/v1/mini";
const TG = window.Telegram && window.Telegram.WebApp;
const LABEL = { home: "მთავარი", cash: "ფული", funds: "ინვესტიცია", tax: "გადასახადები", wc: "საბრუნავი", books: "ბუღალტერია", recon: "მომწოდებლები", alerts: "შეტყობინებები", trust: "წყაროები",
  sales: "გაყიდვები", purchases: "შესყიდვები", vat: "დღგ", imports: "იმპორტი", tenders: "ტენდერები" };
const ROLE = { admin: "ადმინისტრატორი", family: "ოჯახი", investor: "ინვესტორი", accountant: "ბუღალტერი" };
// copy of FEED_LABEL in lib/feeds.mjs (the bot's cards and digest use that one) - change both together
const FEED_LABEL = {
  oris: "ORIS (ნერსერი)", oris_main: "ORIS (მწვანე სახლი)", rsge: "rs.ge (ნერსერი)", rsge_main: "rs.ge (მწვანე სახლი)",
  bank_bog: "BOG ბანკი (ნერსერი)", bank_bog_main: "BOG ბანკი (მწვანე სახლი)", bank_procredit_main: "ProCredit ბანკი (მწვანე სახლი)", bank_tbc_main: "TBC ბანკი (მწვანე სახლი)",
  mail: "ფოსტა", fx: "ეროვნული ბანკის კურსი", weather: "ამინდი", controls: "კონტროლები", alerts: "სიგნალები (A1-A18)", bot: "ბოტი", zaza: "ზაზას სია",
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 0) => v == null || v === "" ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const gel = (v, d = 0) => v == null ? "—" : num(v, d) + " ₾";   // no-break space: „₾" never wraps onto a line alone
const MON = ["იან", "თებ", "მარ", "აპრ", "მაი", "ივნ", "ივლ", "აგვ", "სექ", "ოქტ", "ნოე", "დეკ"];
const dt = (s) => { if (!s) return "—"; const d = new Date(String(s).length <= 10 ? s + "T00:00:00" : s); return d.getDate() + " " + MON[d.getMonth()]; };
const tm = (s) => { const d = new Date(s); return dt(s) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const daysAgo = (s) => s ? Math.floor((Date.now() - new Date(s + (String(s).length <= 10 ? "T00:00:00" : "")).getTime()) / 864e5) : null;
const card = (title, n, body) => `<div class="card"><div class="card-h"><div class="card-t">${title}</div>${n ? `<div class="card-n">${n}</div>` : ""}</div>${body}</div>`;
const row = (t, c, v, extra = "") => `<div class="row ${extra}"><div class="row-m"><div class="row-t">${t}</div>${c ? `<div class="row-c">${c}</div>` : ""}</div>${v != null ? `<div class="row-v">${v}</div>` : ""}</div>`;
const stat = (l, v, s) => `<div class="stat"><div class="stat-l">${l}</div><div class="stat-v">${v}</div>${s ? `<div class="stat-s">${s}</div>` : ""}</div>`;
// status: a shape (.dot) plus a word; alerts.level is urgent | warn | info (crit/error from older rows)
const lvl = (l) => l === "urgent" || l === "crit" || l === "error" ? "bad" : l === "warn" ? "warn" : l === "info" ? "info" : "ok";
const LEVEL_KA = { bad: "სასწრაფო", warn: "ყურადღება", info: "ინფორმაცია", ok: "რიგზეა" };
// Mtavruli as code points (Mkhedruli U+10D0-10FA, 10FD-10FF -> +0x0BC0) for titles, labels, tabs and the switch; text
// nodes only (caps), so markup and entities stay intact
const mt = (s) => String(s).replace(/[ა-ჺჽ-ჿ]/g, (c) => String.fromCodePoint(c.codePointAt(0) + 0x0BC0));
function caps(root) {
  root.querySelectorAll(".card-t,.hero-l,.stat-l").forEach((el) => { const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) n.nodeValue = mt(n.nodeValue); });
}

// scope = which company the person looks at: nursery | main | both (the bot's switch; ?co= in the link)
let me = null, cur = "home", badge = 0, scope = new URLSearchParams(location.search).get("co") || null;
// plan symbols (circle with a centre point = the nursery's trees, square = the main company's plot); the glyph inside
// is what a text reader gets, the drawing is CSS
const SYM = { nursery: `<span class="sym nursery"><i>◉</i></span>`, main: `<span class="sym main"><i>■</i></span>` };
const symOf = (s) => (s === "both" ? SYM.nursery + SYM.main : SYM[s] || "");

// our light (survey sheet) or dark (cyanotype) token set from Telegram's colorScheme; Telegram's chrome gets the
// canvas colour; the safe areas go into --q-safe-top / --q-safe-bottom
function theme() {
  const dark = TG && TG.colorScheme ? TG.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const root = document.documentElement;
  root.dataset.theme = dark ? "dark" : "light";
  const s = (TG && TG.safeAreaInset) || {}, c = (TG && TG.contentSafeAreaInset) || {};
  root.style.setProperty("--q-safe-top", ((s.top || 0) + (c.top || 0)) + "px");
  root.style.setProperty("--q-safe-bottom", ((s.bottom || 0) + (c.bottom || 0)) + "px");
  const canvas = getComputedStyle(root).getPropertyValue("--q-canvas").trim();
  if (TG) { try { if (TG.setHeaderColor) TG.setHeaderColor(canvas); if (TG.setBackgroundColor) TG.setBackgroundColor(canvas); if (TG.setBottomBarColor) TG.setBottomBarColor(canvas); } catch (e) {} }
}

function drawHead() {
  const one = me.companies[me.scope];
  // the legal name, as on the cards (C: no screen prints „ქესალო" as a company - Telegram's header already does)
  const brand = one ? one.name : "ორი კომპანია";
  $("#brand").textContent = mt(brand); document.title = one ? one.brand : brand;
  $("#logo").innerHTML = symOf(me.scope);

  const sale = d.side === "sale", who = sale ? "მყიდველი" : "მომწოდებელი";
  let s = `<div class="card hero"><div class="hero-l">${sale ? "გაყიდვები" : "შესყიდვები"} ${esc(d.year)} — წლის დასაწყისიდან</div><div class="hero-v">${gel(d.gross_ytd)}</div><div class="hero-s">დღგ-ს ჩათვლით · ${num(d.invoices_ytd)} ფაქტურა · ${num(d.counterparties_ytd)} ${who}</div></div>`;
  s += `<div class="grid2">${stat(monthKa(d.month) + " (ამ თვეში)", gel(d.gross_month), num(d.invoices_month) + " ფაქტურა")}${stat("ზედნადები " + esc(d.year), num(d.waybills_ytd), "ამ თვეში " + num(d.waybills_month))}</div>`;
  s += card(sale ? "ყველაზე დიდი მყიდველები" : "ყველაზე დიდი მომწოდებლები", d.top_pct != null ? `ხუთი — ${d.top_pct}%` : "",
    (d.top || []).map((x) => barRow(esc(x.name), `${num(x.invoices)} ფაქტურა${x.person ? " · ფიზიკური პირი" : ""}`, gel(x.gross), x.share)).join(""));
  s += card("წლის ჯამი", "", row("დღგ-ს გარეშე", "", gel(d.net_ytd)) + row("დღგ", "", gel(d.vat_ytd))
    + (Number(d.dropped_ytd) ? row("გაუქმებული ფაქტურები", `${num(d.dropped_ytd)} ფაქტურა · ჯამში არ შედის`, `<span class="mut">${gel(d.dropped_gross_ytd)}</span>`) : ""));
  return s + `<div class="note">rs.ge: ბოლო ფაქტურა ${dt(d.last_invoice_date)} · ბოლო ზედნადები ${dt(d.last_waybill_date)}</div>`;
}
const VIEW_MAIN = {
  cash(d) {
    const L = d.lines || [];
    const warn = [d.age > 2 ? `ბანკის მონაცემი ${d.age} დღისაა` : "", (d.fx_missing || []).length ? `${d.fx_missing.join(", ")}: კურსი არ არის — ლარის ჯამში არ შედის` : ""].filter(Boolean).join(" · ");
    let s = warn ? `<div class="banner">${esc(warn)}</div>` : "";
    s += `<div class="card hero"><div class="hero-l">სულ ბანკში (ლარში)</div><div class="hero-v">${gel(d.total_gel)}</div><div class="hero-s">ბანკი ${dt(d.as_of)} · უცხოური ვალუტა — ეროვნული ბანკის კურსით</div></div>`;
    s += card("ბანკი და ვალუტა", "", L.map((x) => barRow(esc((BANK_KA[x.bank] || x.bank) + " · " + x.currency),
        `${num(x.accounts_nonzero)} ანგარიში · ${span(x.as_of, x.as_of_newest)}${x.currency !== "GEL" && x.fx_rate ? " · კურსი " + num(x.fx_rate, 4) : ""}`,
        x.currency === "GEL" ? gel(x.balance) : fxAmt(x.balance, x.currency) + `<small>${x.gel_equivalent == null ? "—" : gel(x.gel_equivalent)}</small>`, x.share)).join("")
      + (d.empty_accounts ? row("ნულოვანი ნაშთი", "ანგარიში-ვალუტა", `<span class="mut">${num(d.empty_accounts)}</span>`) : ""));
    if (d.top_bank && d.top_bank.pct != null) s += `<div class="note">ფულის ${d.top_bank.pct}% ${esc(BANK_IN[d.top_bank.bank] || d.top_bank.bank)}.</div>`;
    return s;
  },
  books(d) {
    // F1 (8.11): no change log - last entry, entered on, +new lines; the year from ORIS without a profit line
    const l = d.lag || {};
    let s = Number(l.days_since_entry) > 10 ? `<div class="banner">ბოლოს შეყვანილია ${l.days_since_entry} დღის წინ</div>` : "";
    s += `<div class="grid2">${stat("ბოლო გატარების თარიღი", dt(l.last_entry_date), "ORIS")}${stat("ბოლოს შეყვანილი", dt(l.last_entered_on), l.days_since_entry != null ? l.days_since_entry + " დღის წინ" : "")}</div>`;
    s += card("ახალი გატარებები 7 დღეში", "", row("დამატებული", "", num(l.new_lines_7d)));
    s += card(`${esc(d.year)} — ბუღალტერიით`, "ORIS",
      row("შემოსავალი", "", `<span class="pos">${gel(d.revenue)}</span>`)
      + row("საოპერაციო ხარჯი", `თვითღირებულება ${gel(d.opex_cost)} · მიწოდება ${gel(d.opex_delivery)} · ადმინისტრაციული ${gel(d.opex_admin)}`, gel(d.opex))
      + (d.wip > 0 ? row("დაუმთავრებელ სამუშაოებში დაგროვდა", "ხარჯად გადავა სამუშაოს დასრულებისას, ჩვეულებრივ 31.12-ს", `<span class="pill p-warn">${gel(d.wip)}</span>`) : "")
      + row("არასაოპერაციო, ნეტო", `შემოსავალი ${gel(d.non_op_income)} · ხარჯი ${gel(d.non_op_expense)}`, `<span class="${d.non_op < 0 ? "neg" : ""}">${gel(d.non_op)}</span>`)
      + row("მოგების გადასახადი, ჯარიმები, განსაკუთრებული", "", gel(d.class9)));
    if (d.wip > 0) s += `<div class="note">კიდევ ${gel(d.wip)} ხარჯი დაუმთავრებელ სამუშაოებშია — შედეგი წლის დახურვამდე არ ჩანს, ამიტომ მოგება აქ არ იწერება.</div>`;
    return s;
  },
  sales: rsgeView,
  purchases: rsgeView,
  vat(d) {
    const net = Number(d.net);
    let s = `<div class="card hero"><div class="hero-l">დღგ ${esc(d.year)} — ${net > 0 ? "გადასახდელი" : "ჩასათვლელი"}</div><div class="hero-v">${gel(net)}</div><div class="hero-s">გაყიდვების დღგ − შესყიდვების დღგ, rs.ge ფაქტურებით</div></div>`;
    s += `<div class="grid2">${stat("გაყიდვების დღგ", gel(d.output), "გაყიდვის ფაქტურები")}${stat("შესყიდვების დღგ", gel(d.input), Number(d.awaiting) ? "მ.შ. დასადასტურებელი " + gel(d.awaiting) : "შესყიდვის ფაქტურები")}</div>`;
    s += card("თვეების მიხედვით", "გაყიდვა − შესყიდვა", (d.months || []).map((r) => row(monthKa(r.month), `გაყიდვა ${gel(r.output_vat)} · შესყიდვა ${gel(r.input_vat)}`,
      `<span class="${Number(r.net_vat) > 0 ? "" : "pos"}">${gel(r.net_vat)}</span>`)).join(""));
    return s + `<div class="note">ეს ფაქტურების სურათია — არა დეკლარაცია და არა საგადასახადო ბარათის ნაშთი (ბარათი ჯერ არ ჩანს). ბოლო ფაქტურა ${dt(d.last)}.</div>`;
  },
  imports(d) {
    const R = d.registers || [], last = R.map((r) => r.last_reg_date).sort().pop();
    let s = `<div class="card hero"><div class="hero-l">იმპორტი ${esc(d.year)} — საბაჟო ღირებულება</div><div class="hero-v">${gel(d.value_gel)}</div><div class="hero-s">საბაჟოს მონაცემი ${dt(d.as_of)}</div></div>`;
    s += `<div class="grid2">${stat("დეკლარაცია", num(d.declarations), last ? "ბოლო " + dt(last) : "")}${stat("დღგ + ბაჟი", gel(d.vat_duty), "საბაჟოზე")}</div>`;
    s += card("დეკლარაციები", "", R.length ? R.map((r) => row(esc(REG[r.register] || r.register), `${num(r.declarations)} დეკლარაცია · ბოლო ${dt(r.last_reg_date)}`, gel(r.value_gel))).join("")
      : `<div class="empty">წელს იმპორტი არ არის</div>`);
    return s + card("გადასახადები", "", row("იმპორტის დღგ", "", gel(d.import_vat)) + row("საბაჟო გადასახადი", "", gel(d.import_duty)) + (Number(d.excise) ? row("აქციზი", "", gel(d.excise)) : ""));
  },
  tenders(d) {
    const t = d.s, src = `<div class="note">ცოდნის ბაზა ${dt(d.built)} · tendermonitor.ge ${dt(d.tm_updated)}</div>`;
    if (!t) return card(`ტენდერები ${esc(d.year)}`, "", `<div class="empty">წელს ტენდერი არ არის</div>`) + src;
    let s = `<div class="card hero"><div class="hero-l">ტენდერები ${esc(d.year)} — მოგებული</div><div class="hero-v">${esc(t.won)} / ${esc(t.tenders)}</div><div class="hero-s">გამარჯვება ${esc(t.win_rate_pct)}% · ხელშეკრულებები ${gel(t.contract_won)}</div></div>`;
    s += `<div class="grid2">${stat("წაგებული", esc(t.lost), Number(t.failed) ? "ჩაშლილი " + esc(t.failed) : "")}${stat("მიმდინარე", esc(t.in_progress), "")}</div>`;
    s += card("ბოლო ხუთი", "", (d.last || []).map((r) => { const [st, cl] = TENDER[r.status] || [r.status, "p-grey"];
        return row(esc(cut(String(r.who).replace(/"([^"]*)"/g, "„$1“"), 80)), dt(r.announced) + " · " + esc(cut(r.subject, 70)), `${gel(r.amount)}<small><span class="pill ${cl}">${esc(st)}</span></small>`); }).join("")
      + `<div class="note">თანხა: მოგებულზე — ხელშეკრულება, დანარჩენზე — ჩვენი ბოლო ფასი.</div>`);
    s += card("წლის ჯამი", "", row("მოგებული ხელშეკრულებები", "", `<span class="pos">${gel(t.contract_won)}</span>`)
      + row("მოგებული ერთადერთი მონაწილით", "", esc(t.won_sole_bidder)) + row("სხვამ მოიგო (ვმონაწილეობდით)", "", `<span class="mut">${gel(t.contract_lost_other_winner)}</span>`));
    return s + src;
  },
};

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-t]"); if (t) { if (TG && TG.HapticFeedback) TG.HapticFeedback.selectionChanged(); return load(t.dataset.t); }
  const c = e.target.closest("[data-co]"); if (c) { if (TG && TG.HapticFeedback) TG.HapticFeedback.selectionChanged(); return load(cur, c.dataset.co); }
  const g = e.target.closest("[data-go]"); if (g && me && me.tabs.includes(g.dataset.go)) return load(g.dataset.go);
  const r = e.target.closest("[data-det]"); if (r) { const el = document.getElementById("det" + r.dataset.det); el.classList.toggle("open"); r.classList.toggle("open-r", el.classList.contains("open")); }
});

theme();
if (TG) { TG.ready(); TG.expand(); if (TG.onEvent) ["themeChanged", "safeAreaChanged", "contentSafeAreaChanged"].forEach((e) => TG.onEvent(e, theme)); }
const start = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("tab") || "home";
load(LABEL[start] ? start : "home");
</script>
</body>
